[package]
name = "pct-zk-script"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
pct-zk-lib = { path = "../lib", features = ["host"] }
sp1-sdk = { version = "6.8.1" }
sp1-verifier = { version = "6.8.1", features = ["ark"] }
ark-bn254 = "0.5"
ark-serialize = "0.5"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
sp1-build = "6.8.1"

[features]
native-gnark = ["sp1-sdk/native-gnark"]
