[package]
name = "plumbline-registry"
version = "0.1.0"
description = "Plumbline registry: Groth16-verified sealed-eval scores with the entrant's payout"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "plumbline_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
solana-bn254 = "2"
