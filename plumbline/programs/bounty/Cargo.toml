[package]
name = "plumbline-bounty"
version = "0.1.0"
description = "Plumbline pay-on-proof: escrowed reward paid to the payout bound in a verified sealed-eval score"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "plumbline_bounty"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
