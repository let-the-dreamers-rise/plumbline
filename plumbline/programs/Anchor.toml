[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[workspace]
members = ["registry", "bounty"]

[programs.localnet]
plumbline_registry = "Eicw3HXxXN7kckn5XB4WDGQG2c61BLf7X7QpGehLTgAW"
plumbline_bounty = "9mDieYQNR2L9xgaqS6LK26kxR26rA4R9UcFntG369RPf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Run the tests with scripts/localnet-test.sh (fresh validator per phase, forged genesis accounts for
# tests/bounty.ts). Plain `anchor test` misreports port 8899 as in use in this container.
[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/registry.ts tests/verified.ts"
