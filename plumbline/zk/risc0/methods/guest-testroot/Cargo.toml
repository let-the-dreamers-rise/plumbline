[package]
name = "sealed_score_testroot"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "unstable"] }
tessera-zk-lib = { path = "tessera-zk-lib", features = ["test-root"] }

# RISC Zero's accelerated forks: P-256 ECDSA and SHA-256 run on the zkVM's precompiles.
[patch.crates-io]
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }

[profile.release]
opt-level = 3
lto = true
